name: Nutrition sources

# Скачивает USDA FoodData Central и Open Food Facts и коммитит выжимки в data/.
# Запускается вручную или при изменении скрипта загрузки.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/fetch_sources.py
      - .github/workflows/sources.yml

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/fetch_sources.py
      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "data: обновить выжимки USDA FoodData Central и Open Food Facts"
          git pull --rebase origin main
          git push origin HEAD:main
